name: Test run (single video)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional topic override (leave blank to research trending)'
        required: false
        default: ''
      caption_mode:
        description: 'Caption timing — whisper (accurate, slower) or estimated (faster)'
        required: false
        default: whisper
        type: choice
        options:
          - whisper
          - estimated

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'   # chatterbox-tts requires 3.11 specifically

      - name: Cache TTS + caption models
        uses: actions/cache@v5
        with:
          path: hf_cache/
          # Chatterbox-Turbo + faster-whisper model downloads (HF_HOME).
          # Not the clone reference clips — those are cached below.
          # Bump suffix when either model changes.
          key: chatterbox-whisper-models-v1

      - name: Cache converted voice refs
        uses: actions/cache@v5
        with:
          # mp3→wav conversions named after each source stem
          # (build/auto/voices/male1 - dan.wav, etc.)
          path: build/auto/voices/
          key: auto-voice-wavs-v2-${{ hashFiles('assets/auto/male/*.mp3', 'assets/auto/female/*.mp3', 'assets/auto/voice_reference.mp3') }}

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run channels
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # Legacy unprefixed Auto secrets mapped to AUTO_* env names used by main.py
          AUTO_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          AUTO_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          AUTO_GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          AUTO_DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          AUTO_DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RANKEDNICHE_DISCORD_WEBHOOK_URL: ${{ secrets.RANKEDNICHE_DISCORD_WEBHOOK_URL }}
          RANKEDNICHE_GOOGLE_CLIENT_ID: ${{ secrets.RANKEDNICHE_GOOGLE_CLIENT_ID }}
          RANKEDNICHE_GOOGLE_CLIENT_SECRET: ${{ secrets.RANKEDNICHE_GOOGLE_CLIENT_SECRET }}
          RANKEDNICHE_GOOGLE_REFRESH_TOKEN: ${{ secrets.RANKEDNICHE_GOOGLE_REFRESH_TOKEN }}
          RANKEDNICHE_DRIVE_INTAKE_FOLDER_ID: ${{ secrets.RANKEDNICHE_DRIVE_INTAKE_FOLDER_ID }}
          RANKEDNICHE_DRIVE_OUTPUT_FOLDER_ID: ${{ secrets.RANKEDNICHE_DRIVE_OUTPUT_FOLDER_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          # Blank input => trending research in main.py
          VIDEO_TOPIC: ${{ inputs.topic }}
          CAPTION_MODE: ${{ inputs.caption_mode || 'whisper' }}
          HF_HOME: ${{ github.workspace }}/hf_cache
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TOPIC: ${{ inputs.topic || 'trending research' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          python main.py > >(tee pipeline_output.log) 2>&1 &
          PIPE_PID=$!

          (
            sleep 1800
            if kill -0 "$PIPE_PID" 2>/dev/null; then
              echo "Pipeline still running after 30 minutes — notifying Discord."
              if [ -n "${DISCORD_WEBHOOK_URL:-}" ]; then
                TAIL=""
                if [ -f pipeline_output.log ]; then
                  TAIL=$(tail -n 15 pipeline_output.log | sed 's/`/'"'"'/g')
                fi
                CONTENT=$(printf '⏳ Video still rendering after **30 minutes**.\nTopic: %s\nRun: %s\nJob limit: 3 hours.\n```\n%s\n```' \
                  "$TOPIC" "$RUN_URL" "${TAIL:-(no log yet)}")
                CONTENT="${CONTENT:0:1900}"
                jq -n --arg content "$CONTENT" --arg username "auto-tube devops" \
                  '{content: $content, username: $username}' \
                  | curl -sS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL" \
                  >/dev/null || echo "Discord long-running notify failed (non-fatal)"
              fi
            fi
          ) &
          WATCHDOG_PID=$!

          wait "$PIPE_PID"
          STATUS=$?
          kill "$WATCHDOG_PID" 2>/dev/null || true
          wait "$WATCHDOG_PID" 2>/dev/null || true
          exit "$STATUS"
