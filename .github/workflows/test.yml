name: Test run (single video)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional topic override (leave blank to research trending)'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # chatterbox-tts requires 3.11 specifically

      - name: Cache voice + caption models
        uses: actions/cache@v4
        with:
          path: hf_cache/
          # Holds both Chatterbox-Turbo (voice.py) and faster-whisper
          # (assemble.py) downloads -- HF_HOME points both at this same
          # dir. Bump this suffix again any time either model changes,
          # to force a fresh combined cache instead of reusing a stale one.
          key: chatterbox-whisper-models-v1

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          # Blank input => trending research in main.py
          VIDEO_TOPIC: ${{ inputs.topic }}
          HF_HOME: ${{ github.workspace }}/hf_cache